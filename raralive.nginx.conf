# Rara Live — Nginx config (HTTP only, no SSL)
# Place this file at: /etc/nginx/sites-available/raralive
# Then run:
#   ln -s /etc/nginx/sites-available/raralive /etc/nginx/sites-enabled/raralive
#   nginx -t
#   systemctl reload nginx
#
# After SSL cert is ready, add the 3 ssl_* lines + listen 443 blocks manually.

# ── api.raralive.in ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.raralive.in;

    client_max_body_size 50M;

    # Serve uploaded files (avatars, gift images, etc.)
    location /uploads/ {
        alias /var/www/raralive/backend/uploads/;
    }

    # Proxy everything else to Node.js
    location / {
        proxy_pass http://127.0.0.1:5103;
        proxy_http_version 1.1;

        # Required for Socket.io WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout needed for socket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# ── admin.raralive.in ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.raralive.in;

    root /var/www/raralive/admin/dist;
    index index.html;

    # React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

